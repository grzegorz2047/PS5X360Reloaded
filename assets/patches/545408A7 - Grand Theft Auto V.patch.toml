title_name = "Grand Theft Auto V"
title_id = "545408A7" # TT-2055
hash = "C290B43AEEFA5166" # default.xex (Disc 1 and Disc 2 boot the same executable)

[[patch]]
    name = "Audio freeze fix (prologue)"
    desc = "Without it the game freezes ~100 s into the prologue (at the line Dam rade. Dam rade... O Boze. in the Polish subtitles): the audio mixer moves on to a prebuffered stream within one call and reads it without refreshing its copy of the stream's state, which never changes, so the audio thread waits forever. With it the mixer refreshes every stream it reads (confirmed on the console with 1.0.6-work-fix148j2-155b)."
    author = "PS5X360"
    is_enabled = true

    # 83140458: bne cr6, 0x83140480 (skip the lock 836A93C8 and snapshot 836A9BB0 once one was done
    # in this call of the mixer 83140340) -> nop: every stream set the loop at 83140450 reads is
    # locked and snapshotted first; the lock and snapshot return at once for a set already done.
    [[patch.be32]]
        address = 0x83140458
        value = 0x60000000
