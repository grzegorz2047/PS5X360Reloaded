name: Rebuild v1.0.2 from source drops (not for release)

# Assembles the PS5X360 v1.0.2 sources from the author's public source drops
# (tools/source-1.0.2/assemble.py) and compiles them into eboot.bin with the same PS5
# toolchain as build-ps5.yml. Dispatched, the result is a test artifact, not a release: some
# parts of 1.0.2 are not in any drop (docs/SOURCE-1.0.2.md). A source release goes through
# release-source.yml, which calls this workflow in release mode (below).
# The artifact carries src102-out/lang/*.txt, the English-keyed language files the rebuilt
# eboot reads (fix 25): a test package replaces <title id>/assets/lang/*.txt with them.
#
# Caches: the built RADV driver and payload SDK (.deps/references/PS5_Vulkan/.deps/native),
# keyed by the three pinned reference commits and the RADV build script, so Mesa and its
# build-only packages are needed only when that key changes; and ccache for the compile.
#
# Release mode (workflow_call from release-source.yml with release: true and version: X.Y.Z):
# the version label is that version (assemble.py --release, PS5X360_BUILD_VERSION) instead of
# tools/source-1.0.2/BUILD_VERSION's candidate label, no fix is left out, and after the link
# tools/source-1.0.2/check_release_elf.py checks eboot.elf/eboot.bin carry
# "TrinityX360 v<version>" and "BOOT version <version>", no candidate label and no older name's
# label (the official app's "PS5X360 v<version>", "PS5X360Reloaded v<version>"), and SOURCES.json
# leaves no fix out. Only
# then is the artifact named eboot-<version>-from-source (a failed release run uploads its logs
# under the old NOT-FOR-RELEASE name), and the assembled tree build/src102 goes out as the GPL-3.0
# corresponding source PS5X360-<version>-source.tar.xz (artifact source-<version>): a
# deterministic tar (names sorted, mtime of the commit, owner and group 0) without .git, the
# host checks' build/ and their copied tools/check-*, under the top folder PS5X360-<version>-source.
on:
  workflow_dispatch:
    inputs:
      skip_fixes:
        description: Fixes to leave out of this build (comma-separated, e.g. 01), for a test build
        required: false
        default: ''
      lto:
        description: thin for ThinLTO of the core and the title (GitHub issue 2), empty for none
        required: false
        default: ''
      title_opt:
        description: Optimization level of the title objects (default -O2 as 1.0.2; -O3 for a test build)
        required: false
        default: ''
      skip_checks:
        description: Skip the parallel host fix checks job (e.g. when source-fix-checks.yml already runs)
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: The version label (X.Y.Z for a release); empty = tools/source-1.0.2/BUILD_VERSION
        type: string
        required: false
        default: ''
      release:
        description: A release build (version required, no fix left out, checked eboot, source tarball)
        type: boolean
        required: false
        default: false
    outputs:
      artifact:
        description: Name of the eboot artifact (eboot-<version>-from-source for a passed release)
        value: ${{ jobs.rebuild.outputs.artifact }}
      eboot_sha256:
        description: SHA-256 of eboot.bin
        value: ${{ jobs.rebuild.outputs.eboot_sha256 }}
      source_artifact:
        description: Name of the GPL source artifact (source-<version>; release only)
        value: ${{ jobs.rebuild.outputs.source_artifact }}
      source_tarball:
        description: File name of the GPL source tarball in that artifact (release only)
        value: ${{ jobs.rebuild.outputs.source_tarball }}
      source_sha256:
        description: SHA-256 of the GPL source tarball (release only)
        value: ${{ jobs.rebuild.outputs.source_sha256 }}

permissions:
  contents: read

env:
  PS5_VULKAN_REV: 3f3ee69607013b345d2baa6d6a37c86745649a08
  PS5_MESA_REV: 0b2d6d1a61d9bbf89cf8beb88a696144f67c61f8
  PS5_PAYLOAD_SDK_REV: 95c08f27386fc698f6bbe21dde3030140a41d10b
  VULKAN_SDK_VER: 1.4.341.1

jobs:
  checks:
    name: Host checks of the 1.0.2 fixes
    if: ${{ !inputs.skip_checks }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout PS5X360
        uses: actions/checkout@v4

      - name: Ensure ccache and lld-18
        run: |
          if ! command -v ccache >/dev/null || ! command -v ld.lld-18 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ccache lld-18
          fi

      - name: Restore Vulkan SDK shader tools
        id: vk_tools_checks
        uses: actions/cache@v4
        with:
          path: ~/vulkan-sdk/${{ env.VULKAN_SDK_VER }}/x86_64
          key: vulkan-shader-tools-${{ env.VULKAN_SDK_VER }}

      - name: Install Vulkan SDK shader tools
        run: |
          set -euo pipefail
          v="${VULKAN_SDK_VER}"
          if [[ "${{ steps.vk_tools_checks.outputs.cache-hit }}" != "true" ]]; then
            file=vulkansdk-linux-x86_64-$v.tar.xz
            curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$file" \
              "https://sdk.lunarg.com/sdk/download/$v/linux/$file"
            echo "3bf0f762afb6c79bc6a9d9fb5998745ccff928800a29619b501ed9de7fd9789b  $RUNNER_TEMP/$file" | sha256sum --check --strict
            mkdir -p "$HOME/vulkan-sdk"
            tar -xJf "$RUNNER_TEMP/$file" -C "$HOME/vulkan-sdk" "$v/x86_64/bin" "$v/x86_64/lib"
          fi
          mkdir -p "$HOME/shader-tools"
          for tool in glslangValidator spirv-opt spirv-dis; do
            ln -sf "$HOME/vulkan-sdk/$v/x86_64/bin/$tool" "$HOME/shader-tools/$tool"
          done
          echo "$HOME/shader-tools" >> "$GITHUB_PATH"

      - name: Restore the source drops
        uses: actions/cache@v4
        with:
          path: .deps/src102-cache
          key: src102-drops-${{ hashFiles('tools/source-1.0.2/assemble.py') }}
          restore-keys: src102-drops-

      - name: Restore host check compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: fix-checks-ccache-${{ github.run_id }}
          restore-keys: fix-checks-ccache-

      - name: Assemble the 1.0.2 source tree
        env:
          PS5X360_SKIP_FIXES: ${{ inputs.skip_fixes }}
        run: python3 -I tools/source-1.0.2/assemble.py --out build/src102 --cache .deps/src102-cache

      - name: Host checks of the fixes
        run: |
          export CCACHE_DIR=$HOME/.cache/ccache CCACHE_MAXSIZE=2G CCACHE_BASEDIR=$GITHUB_WORKSPACE
          export CCACHE_COMPILERCHECK=content CCACHE_SLOPPINESS=time_macros
          bash tools/source-1.0.2/run-fix-checks.sh build/src102
          ccache -s || true

      - name: Save host check compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: fix-checks-ccache-${{ github.run_id }}

  rebuild:
    name: ${{ inputs.release == true && format('Assemble and compile release {0}', inputs.version) || 'Assemble and compile 1.0.2' }}
    runs-on: ubuntu-24.04
    env:
      # Set only in release mode; a dispatched test build has neither input.
      RELEASE: ${{ inputs.release == true && 'true' || '' }}
      RELEASE_VERSION: ${{ inputs.release == true && inputs.version || '' }}
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
      eboot_sha256: ${{ steps.artifact.outputs.eboot_sha256 }}
      source_artifact: ${{ steps.source.outputs.artifact }}
      source_tarball: ${{ steps.source.outputs.tarball }}
      source_sha256: ${{ steps.source.outputs.sha256 }}
    steps:
      - name: Checkout PS5X360
        uses: actions/checkout@v4

      # Before anything is downloaded: a release names a plain X.Y.Z version.
      - name: Check the release version
        if: inputs.release == true
        run: |
          set -euo pipefail
          if [[ -z $RELEASE_VERSION ]]; then
            echo "::error::release: true needs version: X.Y.Z"
            exit 1
          fi
          python3 -I tools/source-1.0.2/check_release_elf.py --version "$RELEASE_VERSION"

      - name: Fetch PS5_Vulkan, PS5_Mesa, and PS5_PayloadSDK references
        run: |
          set -euo pipefail
          fetch_pinned() {
            local name=$1 revision=$2 dir=.deps/references/$1
            git init -q "$dir"
            git -C "$dir" remote add origin "https://github.com/mihawk-99/$name.git"
            git -C "$dir" fetch -q --depth 1 origin "$revision"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$revision"
          }
          mkdir -p .deps/references
          fetch_pinned PS5_Vulkan "$PS5_VULKAN_REV"
          fetch_pinned PS5_Mesa "$PS5_MESA_REV"
          fetch_pinned PS5_PayloadSDK "$PS5_PAYLOAD_SDK_REV"

      - name: Restore the built RADV driver and payload SDK
        id: radv
        uses: actions/cache/restore@v4
        with:
          path: .deps/references/PS5_Vulkan/.deps/native
          key: radv-native-${{ env.PS5_VULKAN_REV }}-${{ env.PS5_MESA_REV }}-${{ env.PS5_PAYLOAD_SDK_REV }}-${{ hashFiles('tools/build-radv-platform.sh') }}

      - name: Install build dependencies (compile only)
        if: steps.radv.outputs.cache-hit == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 lld-18 llvm-18 cmake ninja-build python3 git curl ccache

      - name: Install build dependencies (with Mesa's)
        if: steps.radv.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang-18 lld-18 llvm-18 cmake ninja-build \
            python3 python3-pip python3-venv python3-mako python3-yaml python3-packaging \
            pkg-config git curl unzip jq rsync wget \
            llvm-18-dev libclang-18-dev libclang-cpp18-dev libclc-18-dev \
            libllvmspirvlib-18-dev llvm-spirv-18 spirv-tools glslang-tools ccache
          pipx install meson==1.7.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore Vulkan SDK shader tools
        id: vk_tools
        uses: actions/cache@v4
        with:
          path: ~/vulkan-sdk/${{ env.VULKAN_SDK_VER }}/x86_64
          key: vulkan-shader-tools-${{ env.VULKAN_SDK_VER }}

      - name: Install Vulkan SDK shader tools
        run: |
          set -euo pipefail
          v="${VULKAN_SDK_VER}"
          if [[ "${{ steps.vk_tools.outputs.cache-hit }}" != "true" ]]; then
            file=vulkansdk-linux-x86_64-$v.tar.xz
            curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$file" \
              "https://sdk.lunarg.com/sdk/download/$v/linux/$file"
            echo "3bf0f762afb6c79bc6a9d9fb5998745ccff928800a29619b501ed9de7fd9789b  $RUNNER_TEMP/$file" | sha256sum --check --strict
            mkdir -p "$HOME/vulkan-sdk"
            tar -xJf "$RUNNER_TEMP/$file" -C "$HOME/vulkan-sdk" "$v/x86_64/bin" "$v/x86_64/lib"
          fi
          mkdir -p "$HOME/shader-tools"
          for tool in glslangValidator spirv-opt spirv-dis; do
            ln -sf "$HOME/vulkan-sdk/$v/x86_64/bin/$tool" "$HOME/shader-tools/$tool"
          done
          echo "$HOME/shader-tools" >> "$GITHUB_PATH"

      - name: Restore the source drops
        uses: actions/cache@v4
        with:
          path: .deps/src102-cache
          key: src102-drops-${{ hashFiles('tools/source-1.0.2/assemble.py') }}
          restore-keys: src102-drops-

      # A release leaves no fix out (skip_fixes is a dispatch input only, and assemble.py
      # --release refuses a skip list); its version label is the release's, not BUILD_VERSION's.
      - name: Assemble the 1.0.2 source tree
        env:
          PS5X360_SKIP_FIXES: ${{ inputs.release != true && inputs.skip_fixes || '' }}
          PS5X360_BUILD_VERSION: ${{ inputs.version || '' }}
          PS5X360_RELEASE: ${{ inputs.release == true && '1' || '' }}
        run: python3 -I tools/source-1.0.2/assemble.py --out build/src102 --cache .deps/src102-cache

      - name: Build RADV platform and payload SDK
        if: steps.radv.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # zlib.net intermittently serves CI runners something else; seed the identical
          # tarball from zlib's GitHub release (setup-native-dependencies.sh checks its SHA-256).
          zlib_dir=.deps/references/PS5_Vulkan/.deps/native/zlib
          mkdir -p "$zlib_dir"
          curl -fsSL --retry 5 --retry-all-errors -o "$zlib_dir/zlib-1.3.2.tar.gz" \
            https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
          echo "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16  $zlib_dir/zlib-1.3.2.tar.gz" | sha256sum --check --strict
          mkdir -p build
          bash tools/build-radv-platform.sh

      - name: Save the built RADV driver and payload SDK
        if: steps.radv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps/references/PS5_Vulkan/.deps/native
          key: ${{ steps.radv.outputs.cache-primary-key }}

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: src102-ccache-${{ github.run_id }}
          restore-keys: src102-ccache-

      - name: Compile and link eboot.bin
        run: |
          set -o pipefail
          export CCACHE_DIR=$HOME/.cache/ccache CCACHE_MAXSIZE=2G CCACHE_BASEDIR=$GITHUB_WORKSPACE
          export CCACHE_COMPILERCHECK=content CCACHE_SLOPPINESS=time_macros
          export PS5X360_LTO='${{ inputs.lto }}'
          export PS5X360_TITLE_OPT='${{ inputs.title_opt }}'
          bash tools/source-1.0.2/build.sh build/src102 build/src102-out 2>&1 | tee build/src102-build.log
          ccache -s || true

      # Release: the eboot carries this version's label and no candidate label, and no fix was
      # left out (tools/source-1.0.2/check_release_elf.py; a bare "candidate_" is RADV's).
      - name: Check the release eboot
        if: inputs.release == true
        run: >-
          python3 -I tools/source-1.0.2/check_release_elf.py --version "$RELEASE_VERSION"
          --elf build/src102-out/eboot.elf --bin build/src102-out/eboot.bin
          --sources-json build/src102/SOURCES.json

      # Fix 44: a TEST payload that serves made-up Kinect camera frames on the relay port
      # (tools/source-1.0.2/kinect-fake-relay), for trying the relay path on a console without a
      # Kinect. Not part of the package.
      - name: Build the fake Kinect relay test payload
        continue-on-error: true
        run: |
          set -euo pipefail
          sdk=.deps/references/PS5_Vulkan/.deps/native/ps5-payload-sdk
          mkdir -p build/src102-out
          "$sdk/bin/prospero-clang" -O2 -Wall tools/source-1.0.2/kinect-fake-relay/kinect_fake_relay.c -o build/src102-out/kinect-fake-relay.elf

      # Fix 186 (issue #80): the optional, USER-loaded Lapy owned-root elevation helper, built from a
      # pinned upstream commit with the same SDK. LGPL-2.1-or-later (NOT MIT); a separate helper ELF,
      # not linked into eboot.bin and not auto-launched. Non-fatal in a test build: a failure (e.g. a
      # missing SDK symbol for an unvalidated firmware) never blocks eboot.bin or the host checks; the
      # helper is simply absent from the artifact. A release ships it (package.py --lapy-elf), so
      # there the step is fatal and its ELF must be there before the artifact gets the release name.
      - name: Build the Lapy elevation helper (optional, LGPL-2.1, user-loaded)
        continue-on-error: ${{ inputs.release != true }}
        run: |
          set -euo pipefail
          sdk=.deps/references/PS5_Vulkan/.deps/native/ps5-payload-sdk
          bash tools/source-1.0.2/lapy-daemon/build-lapy-daemon.sh "$sdk" build/src102-out
          if [[ "${{ inputs.release == true }}" == true && ! -s build/src102-out/lapy.elf ]]; then
            echo "::error::a release needs build/src102-out/lapy.elf (fix 186)"
            exit 1
          fi

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: src102-ccache-${{ github.run_id }}

      # Fix 25 keys the interface by English: this eboot needs these language files in
      # <title id>/assets/lang/ (PPSA83600) in place of the official package's (keyed by Portuguese).
      - name: Language files of the source build (English keys)
        if: always()
        run: |
          mkdir -p build/src102-out/lang
          cp tools/source-1.0.2/english/lang/*.txt build/src102-out/lang/

      # GPL-3.0 corresponding source of a release: the assembled tree that was compiled, as a
      # deterministic tarball (same commit, same bytes). Left out: .git (the core's and its
      # submodules' shallow clones; SOURCES.json names the core and net-lib commits, and the
      # core commit pins the other submodules), __pycache__, and what the
      # host checks put into the tree (build/, their copied tools/check-*). GitHub takes release
      # assets under 2 GiB.
      - name: GPL source tarball of the assembled tree
        id: source
        if: inputs.release == true
        run: |
          set -euo pipefail
          name=PS5X360-$RELEASE_VERSION-source
          tarball=$name.tar.xz
          epoch=${SOURCE_DATE_EPOCH:-$(git log -1 --format=%ct HEAD)}
          mkdir -p dist
          tar --create --file=- --format=gnu --sort=name --mtime="@$epoch" \
            --owner=0 --group=0 --numeric-owner --mode='u+rwX,go+rX,go-w' \
            --exclude=.git --exclude=__pycache__ \
            --exclude=src102/build --exclude='src102/tools/check-*' \
            --transform="s,^src102,$name,S" \
            -C build src102 | xz -T0 -6 > "dist/$tarball"
          size=$(stat -c %s "dist/$tarball")
          unpacked=$(xz --robot --list "dist/$tarball" | awk -F'\t' '$1 == "totals" {print $5}')
          members=$(xz -dc "dist/$tarball" | tar --list --file=- | wc -l)
          sha=$(sha256sum "dist/$tarball" | cut -d' ' -f1)
          echo "$sha  $tarball" > "dist/$tarball.sha256"
          mib() { awk -v b="$1" 'BEGIN {printf "%.1f MiB", b / 1048576}'; }
          echo "$tarball: $(mib "$size") ($size bytes), unpacked $(mib "$unpacked"), $members entries, sha256 $sha"
          {
            echo "### GPL source $tarball"
            echo "- size: $(mib "$size") ($size bytes); unpacked $(mib "$unpacked"); $members entries"
            echo "- sha256: \`$sha\`"
            echo "- mtime: $epoch (commit time)"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          limit=$((2 * 1024 * 1024 * 1024))
          if (( size >= limit )); then
            echo "::error::$tarball is $size bytes; a GitHub release asset must be under $limit"
            exit 1
          fi
          {
            echo "artifact=source-$RELEASE_VERSION"
            echo "tarball=$tarball"
            echo "sha256=$sha"
          } >> "$GITHUB_OUTPUT"

      # The eboot artifact's name: eboot-<version>-from-source only for a release whose every
      # step passed; a test build, or a failed release (its logs), keeps the NOT-FOR-RELEASE name.
      - name: Name the eboot artifact
        id: artifact
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ $RELEASE == true && $JOB_STATUS == success ]]; then
            name=eboot-$RELEASE_VERSION-from-source
          else
            name=eboot-1.0.2-from-source-NOT-FOR-RELEASE
          fi
          sha=
          if [[ -f build/src102-out/eboot.bin ]]; then
            sha=$(sha256sum build/src102-out/eboot.bin | cut -d' ' -f1)
          fi
          echo "artifact $name, eboot.bin sha256 ${sha:-none}"
          {
            echo "name=$name"
            echo "eboot_sha256=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Upload eboot.bin and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name || 'eboot-1.0.2-from-source-NOT-FOR-RELEASE' }}
          if-no-files-found: warn
          path: |
            build/src102-out/eboot.bin
            build/src102-out/eboot.elf
            build/src102-out/eboot-symbols.txt
            build/src102-out/kinect-fake-relay.elf
            build/src102-out/lapy.elf
            build/src102-out/helper/*
            build/src102-out/lang/*.txt
            build/src102/SOURCES.json
            build/src102-build.log

      - name: Upload the GPL source tarball
        if: inputs.release == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact }}
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/${{ steps.source.outputs.tarball }}
            dist/${{ steps.source.outputs.tarball }}.sha256
