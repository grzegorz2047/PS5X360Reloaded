      - '.github/workflows/source-fix-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Fix checks on the assembled 1.0.2 tree
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The console test image tools (staging from a build artifact, the FTP upload to the
      # pendrive) against a fake package, artifact and FTP; no tree needed.
      - name: Console image tool checks
        run: python3 -I tools/check-console-image-tools.py

      - name: Restore the source drops
        uses: actions/cache@v4
        with:
          path: .deps/src102-cache
          key: src102-drops-${{ hashFiles('tools/source-1.0.2/assemble.py') }}
          restore-keys: src102-drops-

      - name: Assemble the 1.0.2 source tree
        run: python3 -I tools/source-1.0.2/assemble.py --out build/src102 --cache .deps/src102-cache

      - name: Host checks of the fixes
        run: |
          clang++-18 --version | head -1
          bash tools/source-1.0.2/run-fix-checks.sh build/src102
