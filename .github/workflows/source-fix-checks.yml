name: Host checks of the 1.0.2 source fixes

# Assembles the v1.0.2 source tree (tools/source-1.0.2/assemble.py, with the fixes in
# tools/source-1.0.2/fixes) and runs the host checks of those fixes
# (tools/source-1.0.2/run-fix-checks.sh: the tools/check-*.cpp with the runner's clang-18, and
# tools/check-english-source.py for fix 25's English keys with python3). No PS5 toolchain, RADV
# build or apt packages are needed. The source build (build-source-1.0.2.yml) runs the same
# checks before it compiles.
on:
